
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOOKFLIX Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="panel" style="max-width:420px;margin-top:100px">
    <h1 class="logo">BOOK<span>FLIX</span></h1>
    <h2 style="margin:25px 0">Welcome Back</h2>

    <form id="loginForm">
        <input id="email" type="email"
        placeholder="Email Address" required>

        <input id="password" type="password"
        placeholder="Password" required>

        <button class="red-button" type="submit">
            Login
        </button>
    </form>

    <p id="message" style="margin-top:20px"></p>

    <p style="margin-top:20px">
        Don't have an account?
        <a href="register.html" style="color:#e50914">
            Register
        </a>
    </p>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
